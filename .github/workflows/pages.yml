# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: pages-build-deployment

on: workflow_dispatch

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x]

    steps:
    - uses: actions/checkout@v3
      with:
        repository: DannyGooo/yonghuiliu-dev
        ref: main
        token: ${{ secrets.SSH_KEY }}

        
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm install
    
    - name: Configure files
      run: |
        sed -i 's#"homepage": "/"#"homepage": "https://dannygooo.github.io/"#' package.json
        
    - run: npm run build --if-present
    
    - name: List current directory
      run: ls -la

    - name: List build directory
      run: ls -la build/
  
    # - name: Upload GitHub Pages artifact      
    #   # uses: actions/upload-artifact@v4
    #   uses: actions/upload-pages-artifact@v1
    #   with:
    #     name: github-pages
    #     path: build/

    - name: Package artifact without symlinks
      run: |
        tar --dereference -cf artifact.tar build/
        gzip -n artifact.tar  # produces artifact.tar.gz
    
    - name: List current directory
      run: ls -la

    - name: List build directory
      run: ls -la build/
    
    
    - name: Upload packaged artifact
      uses: actions/upload-artifact@v4
      with:
        name: github-pages
        path: artifact.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      
    steps:
      # - name: Download artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: github-pages
      #     path: ./build
    
      # - name: List current directory
      #   run: ls 

      # - name: List build directory
      #   run: ls -la build/
      
      # - name: Deploy to GitHub Pages
      #   id: deployment
      #   uses: actions/deploy-pages@v4
      #   with:
      #     artifact_name: github-pages

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .
      
      - name: List current directory
        run: ls 

      - name: Extract archive
        run: |
          tar xzf artifact.tar.gz
          rm artifact.tar.gz  # Remove the archive after extraction

      - name: List current directory
        run: ls 
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
  
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          # path: './'
          artifact_name: github-pages

  
